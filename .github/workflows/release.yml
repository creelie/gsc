name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v1.0.0"
        required: true
      target:
        description: "Branch or commit to tag"
        required: true
        default: main
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" EnergyCostOfAPhaseShift.pdf \
            --target "$(git rev-parse HEAD)" \
            --title "The Energy Cost of a Phase Shift ${{ inputs.tag }}" \
            --notes "Paper, LaTeX source, numerical checks and Lean certificate."
